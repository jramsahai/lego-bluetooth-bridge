[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    ; Legoino 1.1.0 declares "depends=NimBLE-Arduino" with no version bound, so
    ; PlatformIO otherwise resolves NimBLE-Arduino 2.x, whose API Legoino does
    ; not compile against (getClientListSize, setScanResponse, setPower and the
    ; NimBLEAddress/addData string overloads all changed in 2.0). Pin the 1.x
    ; line Legoino was written for.
    h2zero/NimBLE-Arduino@^1.4.2
    corneliusmunz/Legoino@^1.1.0

[env:native]
platform = native
test_framework = unity
